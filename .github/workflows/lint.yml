name: Lint

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install linter
        run: |
          python -m pip install --upgrade pip
          pip install ruff flake8

      - name: Run linting
        run: |
          ruff check . || flake8 .
