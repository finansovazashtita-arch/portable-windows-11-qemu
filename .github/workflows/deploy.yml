name: Deploy FinansProtect

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'deploy/helm/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  HELM_CHART_PATH: deploy/helm/finansprotect

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'dev' }}
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.14.0'

      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Determine values file
        id: values
        run: |
          ENV="${{ github.event.inputs.environment || 'dev' }}"
          echo "env=${ENV}" >> $GITHUB_OUTPUT
          echo "values_file=values-${ENV}.yaml" >> $GITHUB_OUTPUT
          echo "namespace=finansprotect-${ENV}" >> $GITHUB_OUTPUT

      - name: Create namespace if not exists
        run: |
          kubectl create namespace ${{ steps.values.outputs.namespace }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy with Helm
        run: |
          helm upgrade --install finansprotect ${{ env.HELM_CHART_PATH }} \
            --namespace ${{ steps.values.outputs.namespace }} \
            --values ${{ env.HELM_CHART_PATH }}/values.yaml \
            --values ${{ env.HELM_CHART_PATH }}/${{ steps.values.outputs.values_file }} \
            --set image.tag=${{ github.sha }} \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --wait \
            --timeout 10m

      - name: Verify deployment
        run: |
          echo "=== Deployment Status ==="
          kubectl -n ${{ steps.values.outputs.namespace }} get deployments
          echo ""
          echo "=== Pod Status ==="
          kubectl -n ${{ steps.values.outputs.namespace }} get pods
          echo ""
          echo "=== Service Status ==="
          kubectl -n ${{ steps.values.outputs.namespace }} get svc
          echo ""
          echo "=== Ingress Status ==="
          kubectl -n ${{ steps.values.outputs.namespace }} get ingress

      - name: Run post-deploy health check
        run: |
          echo "Waiting for pods to be ready..."
          kubectl -n ${{ steps.values.outputs.namespace }} wait \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/name=finansprotect \
            --timeout=300s
          echo "✅ All pods are ready!"
