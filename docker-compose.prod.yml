version: '3.8'

services:
  microinvest-ocr-service:
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=WARNING
    security_opt:
      - no-new-privileges:true
    read_only: true
    user: "1000:1000"
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
