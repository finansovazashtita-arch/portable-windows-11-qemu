[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    tier1: Tier 1 Feature Coverage tests (synthetic/mock)
    tier2: Tier 2 Boundary & Corner Case tests (synthetic/mock)
    tier3: Tier 3 Cross-Feature Combination tests (synthetic/mock)
    tier4: Tier 4 Real-World Application Scenario tests (live E2E)
    live: Tests requiring live VM / VNC / SQL / PDF resources
    dry_run: Synthetic fixture & mock tests (zero external dependency)
    ocr: OCR & line-item extraction subsystem tests
    accounting: Bulgarian double-entry translation & XML subsystem tests
    vnc: VNC & Delta Pro GUI automation subsystem tests
    audit: SQL verification & TRANSFER.LOG audit subsystem tests
