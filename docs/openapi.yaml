openapi: 3.1.0
info:
  title: FinansProtect Enterprise Compliance & Audit REST API
  summary: Real-time EU Multi-Entity Compliance & Accounting API
  description: |
    # FinansProtect Enterprise API

    The FinansProtect API delivers real-time Bulgarian & EU multi-entity tax compliance monitoring, 
    NRA (НАП) E-Invoice SAF-T stream processing, post-quantum cryptographic mesh replication, 
    edge-AI mobile receipt scanning, and automated double-entry accounting reconciliation.

    ## Features
    - **API Versioning**: Supports path versioning (`/api/v1/...`, `/api/v2/...`) and header-based versioning (`X-API-Version`).
    - **Schema Validation**: Built-in OpenAPI 3.1 request and response payload validation middleware.
    - **Interactive Documentation**: Embedded Swagger UI accessible via `/api/docs`.
    - **Security**: OAuth2 Bearer Token and API Key authentication schemes.
  version: 2.0.0
  termsOfService: https://finansprotect.bg/terms
  contact:
    name: FinansProtect Enterprise Support
    email: support@finansprotect.bg
    url: https://finansprotect.bg/support
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://127.0.0.1:8095
    description: Local Dashboard Server
  - url: http://localhost:8095
    description: Local Development Server
  - url: https://api.finansprotect.bg
    description: Production Cluster Gateway
tags:
  - name: Telemetry
    description: System health, entity metrics, and PQC mesh telemetry
  - name: Compliance
    description: Real-time compliance summary, discrepancy corrections & NRA E-Invoicing
  - name: Mobile Suite
    description: Edge-AI fiscal receipt processing, WASM OCR status, and offline queue sync
  - name: Documentation
    description: OpenAPI specifications & interactive UI endpoints
paths:
  /api/docs:
    get:
      tags:
        - Documentation
      summary: Interactive Swagger UI Dashboard
      description: Renders interactive HTML Swagger UI for inspecting and testing API endpoints.
      operationId: getSwaggerUI
      responses:
        '200':
          description: HTML page containing Swagger UI viewer
          content:
            text/html: {}
  /api/openapi.json:
    get:
      tags:
        - Documentation
      summary: OpenAPI 3.1 Specification (JSON)
      description: Returns full OpenAPI 3.1 spec in JSON format.
      operationId: getOpenAPISpecJSON
      responses:
        '200':
          description: OpenAPI 3.1 JSON Specification
          content:
            application/json: {}
  /api/openapi.yaml:
    get:
      tags:
        - Documentation
      summary: OpenAPI 3.1 Specification (YAML)
      description: Returns full OpenAPI 3.1 spec in YAML format.
      operationId: getOpenAPISpecYAML
      responses:
        '200':
          description: OpenAPI 3.1 YAML Specification
          content:
            text/yaml: {}
  /api/v1/telemetry:
    get:
      tags:
        - Telemetry
      summary: System & Compliance Telemetry (v1)
      description: Returns current overall compliance score, grand total balances, audit SHA-256 head, and service connectivity.
      operationId: getTelemetryV1
      responses:
        '200':
          description: Successful telemetry response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryResponse'
  /api/v2/telemetry:
    get:
      tags:
        - Telemetry
      summary: System & Compliance Telemetry (v2)
      description: Enhanced v2 telemetry endpoint with API version metadata, detailed latency metrics, and PQC mesh status.
      operationId: getTelemetryV2
      responses:
        '200':
          description: Enhanced v2 telemetry response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryResponseV2'
  /api/v1/compliance/summary:
    get:
      tags:
        - Compliance
      summary: Multi-Entity Compliance Summary
      description: Retrieves comprehensive multi-entity compliance status, active NRA E-Invoice streams, and PQC nodes.
      operationId: getComplianceSummary
      responses:
        '200':
          description: Full compliance payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceSummaryResponse'
  /api/v1/compliance/telemetry:
    get:
      tags:
        - Compliance
      summary: Compliance Engine Telemetry
      description: Alias endpoint for compliance engine raw telemetry payload.
      operationId: getComplianceTelemetry
      responses:
        '200':
          description: Compliance raw telemetry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceSummaryResponse'
  /api/v1/mobile/status:
    get:
      tags:
        - Mobile Suite
      summary: Edge-AI Mobile Suite Status
      description: Checks edge WASM OCR engine health and offline receipt queue counts.
      operationId: getMobileStatus
      responses:
        '200':
          description: Mobile engine status response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileStatusResponse'
  /api/v1/mobile/scan:
    post:
      tags:
        - Mobile Suite
      summary: Process Edge Fiscal Receipt Scan
      description: Processes raw fiscal receipt OCR text and NRA QR code string, returning double-entry accounting journal entries.
      operationId: scanMobileReceipt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileScanRequest'
      responses:
        '200':
          description: Receipt processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileScanResponse'
        '400':
          description: Invalid scan payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/mobile/sync:
    post:
      tags:
        - Mobile Suite
      summary: Synchronize Offline Receipts Queue
      description: Flushes enqueued offline fiscal receipts to the server audit ledger.
      operationId: syncMobileOfflineQueue
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Offline receipts synchronized successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileSyncResponse'
  /api/v1/compliance/correct:
    post:
      tags:
        - Compliance
      summary: Submit Interactive Audit Correction
      description: Resolves compliance audit discrepancies with CPA auditor digital signature.
      operationId: submitCorrection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectionRequest'
      responses:
        '200':
          description: Correction accepted and ledger updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrectionResponse'
        '400':
          description: Invalid correction payload or missing fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/compliance/einvoice/submit:
    post:
      tags:
        - Compliance
      summary: Submit NRA SAF-T E-Invoice
      description: Submits structured E-Invoice payload for NRA validation and real-time ledger recording.
      operationId: submitEInvoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EInvoiceRequest'
      responses:
        '200':
          description: E-Invoice validated and recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EInvoiceResponse'
        '400':
          description: E-Invoice schema validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/compliance/mesh/sync:
    post:
      tags:
        - Compliance
        - Telemetry
      summary: Trigger Post-Quantum Mesh Node Sync
      description: Initiates PQC replication mesh state synchronization across multi-datacenter nodes.
      operationId: syncMeshNode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeshSyncRequest'
      responses:
        '200':
          description: PQC Node sync initiated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeshSyncResponse'
        '400':
          description: Node synchronization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth2 Bearer JWT authorization token.
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: FinansProtect Enterprise API key.
  schemas:
    TelemetryResponse:
      type: object
      required:
        - status
        - overall_compliance_score
        - grand_total_debits
        - grand_total_credits
        - discrepancy
        - audit_sha256
      properties:
        status:
          type: string
          example: ONLINE
        overall_compliance_score:
          type: number
          example: 99.4
        grand_total_debits:
          type: string
          example: 125,400.00
        grand_total_credits:
          type: string
          example: 125,400.00
        discrepancy:
          type: string
          example: 0.00 EUR
        audit_sha256:
          type: string
          example: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
        qemu_vm_status:
          type: string
          example: CONNECTED_127.0.0.1:5901
        infisical_vault:
          type: string
          example: CONNECTED
        n8n_automation:
          type: string
          example: ACTIVE
        entities_count:
          type: integer
          example: 3
        nra_einvoice_count:
          type: integer
          example: 12
        pqc_nodes_count:
          type: integer
          example: 4
    TelemetryResponseV2:
      type: object
      required:
        - api_version
        - status
        - overall_compliance_score
        - timestamp
      properties:
        api_version:
          type: string
          example: 2.0.0
        status:
          type: string
          example: ONLINE
        overall_compliance_score:
          type: number
          example: 99.4
        timestamp:
          type: number
          example: 1770900000.0
        summary:
          type: object
        pqc_nodes_online:
          type: integer
          example: 4
    ComplianceSummaryResponse:
      type: object
      required:
        - system_status
        - overall_compliance_score
        - entities
        - summary
      properties:
        system_status:
          type: string
          example: ONLINE
        overall_compliance_score:
          type: number
          example: 99.4
        entities:
          type: array
          items:
            type: object
        summary:
          type: object
        nra_einvoice_stream:
          type: array
          items:
            type: object
        pqc_replication_nodes:
          type: array
          items:
            type: object
    MobileStatusResponse:
      type: object
      required:
        - status
        - edge_ocr_wasm_engine
        - queued_scans_count
        - synced_scans_count
      properties:
        status:
          type: string
          example: ONLINE
        edge_ocr_wasm_engine:
          type: string
          example: ACTIVE
        queued_scans_count:
          type: integer
          example: 0
        synced_scans_count:
          type: integer
          example: 15
    MobileScanRequest:
      type: object
      required:
        - ocr_text
      properties:
        ocr_text:
          type: string
          example: "ФИСКАЛЕН БОН\nЕТАП 2000 ЕООД\nЕИК 114077876\nОБЩО: 45.80"
        nra_qr_string:
          type: string
          example: 114077876*2026-01-15*14:30*45.80
        is_offline:
          type: boolean
          example: false
        accountable_person:
          type: string
          example: ИВАН ИВАНОВ
    MobileScanResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          example: true
        offline:
          type: boolean
          example: false
        receipt:
          type: object
        journal_entry:
          type: object
    MobileSyncResponse:
      type: object
      required:
        - success
        - sync_result
      properties:
        success:
          type: boolean
          example: true
        sync_result:
          type: object
    CorrectionRequest:
      type: object
      required:
        - discrepancy_id
        - resolution
      properties:
        discrepancy_id:
          type: string
          example: DISC_BG_001
        resolution:
          type: string
          example: RESOLVED_MANUAL_AUDIT
        auditor:
          type: string
          example: Senior CPA Auditor
    CorrectionResponse:
      type: object
      required:
        - success
        - discrepancy_id
      properties:
        success:
          type: boolean
          example: true
        discrepancy_id:
          type: string
          example: DISC_BG_001
        new_status:
          type: string
          example: RESOLVED
    EInvoiceRequest:
      type: object
      required:
        - invoice_number
        - supplier_eik
        - buyer_eik
        - total_amount_eur
      properties:
        invoice_number:
          type: string
          example: "1000000045"
        supplier_eik:
          type: string
          example: "114077876"
        buyer_eik:
          type: string
          example: "201234567"
        total_amount_eur:
          type: number
          example: 1200.00
    EInvoiceResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          example: true
        nra_hash:
          type: string
          example: a1b2c3d4e5f6...
        status:
          type: string
          example: NRA_ACKNOWLEDGED
    MeshSyncRequest:
      type: object
      required:
        - node_id
      properties:
        node_id:
          type: string
          example: hetzner-fsn1-dc14
    MeshSyncResponse:
      type: object
      required:
        - success
        - node_id
      properties:
        success:
          type: boolean
          example: true
        node_id:
          type: string
          example: hetzner-fsn1-dc14
        pqc_status:
          type: string
          example: IN_SYNC
    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          example: SCHEMA_VALIDATION_ERROR
        message:
          type: string
          example: Missing required property 'discrepancy_id'
        details:
          type: array
          items:
            type: string
