# Default values for finansprotect.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  namespace: finansprotect
  imageRegistry: ghcr.io
  pullSecrets: []
  environment: prod # dev, staging, prod

api:
  replicaCount: 2
  image:
    repository: diokarabaz/finansprotect-api
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 8090
  resources:
    limits:
      cpu: "1000m"
      memory: "1024Mi"
    requests:
      cpu: "100m"
      memory: "256Mi"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  env:
    ENVIRONMENT: prod
    LOG_LEVEL: info

dashboard:
  replicaCount: 2
  image:
    repository: diokarabaz/finansprotect-dashboard
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 8095
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "50m"
      memory: "128Mi"
  env:
    ENVIRONMENT: prod

ingress:
  enabled: true
  className: "traefik"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
  hosts:
    - host: api.finansprotect.bg
      paths:
        - path: /
          pathType: Prefix
          service: api
    - host: app.finansprotect.bg
      paths:
        - path: /
          pathType: Prefix
          service: dashboard
  tls:
    - secretName: finansprotect-tls
      hosts:
        - api.finansprotect.bg
        - app.finansprotect.bg

persistence:
  storageClass: "local-path" # For k3s local storage
  auditLogs:
    enabled: true
    size: 5Gi
    accessMode: ReadWriteOnce
  qemuDisk:
    enabled: true
    size: 100Gi
    accessMode: ReadWriteOnce

security:
  networkPolicy:
    enabled: true
  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 3000
    fsGroup: 2000

monitoring:
  serviceMonitor:
    enabled: true
    interval: 30s
    path: /metrics

infisical:
  enabled: true
  domain: https://vault.finansprotect.bg
  clientId: "" # Set via secrets
  clientSecret: "" # Set via secrets
