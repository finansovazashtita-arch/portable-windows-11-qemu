{{- if .Values.persistence.auditLogs.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "finansprotect.fullname" . }}-audit-logs
  namespace: {{ .Values.global.namespace | default "finansprotect" }}
  labels:
    {{- include "finansprotect.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.auditLogs.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.auditLogs.size }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
{{- end }}
