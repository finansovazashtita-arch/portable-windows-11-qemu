apiVersion: v1
kind: Secret
metadata:
  name: {{ include "finansprotect.fullname" . }}-secrets
  namespace: {{ .Values.global.namespace | default "finansprotect" }}
  labels:
    {{- include "finansprotect.labels" . | nindent 4 }}
  {{- if .Values.infisical.enabled }}
  annotations:
    secrets.infisical.com/auto-reload: "true"
  {{- end }}
type: Opaque
data:
  # In a real environment, these would be populated by Infisical operator
  # or sealed secrets. Providing placeholders for testing/helm validation.
  INFISICAL_CLIENT_ID: {{ .Values.infisical.clientId | b64enc | quote }}
  INFISICAL_CLIENT_SECRET: {{ .Values.infisical.clientSecret | b64enc | quote }}
