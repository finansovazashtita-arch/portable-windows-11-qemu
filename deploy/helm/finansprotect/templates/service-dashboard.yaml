apiVersion: v1
kind: Service
metadata:
  name: {{ include "finansprotect.fullname" . }}-dashboard
  namespace: {{ .Values.global.namespace | default "finansprotect" }}
  labels:
    {{- include "finansprotect.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  type: {{ .Values.dashboard.service.type }}
  ports:
    - port: {{ .Values.dashboard.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "finansprotect.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
