apiVersion: v1
kind: Service
metadata:
  name: {{ include "finansprotect.fullname" . }}-api
  namespace: {{ .Values.global.namespace | default "finansprotect" }}
  labels:
    {{- include "finansprotect.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: 2112
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "finansprotect.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
